services:
  - type: web
    name: nagarflow-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./nagarflow.db
      - key: SECRET_KEY
        generateValue: true
      - key: PRIMARY_CITY
        value: "Indore, Madhya Pradesh, India"
      - key: DEMO_MODE
        value: "true"

  - type: web
    name: nagarflow-ai-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nagarflow-ai-backend
          property: url
